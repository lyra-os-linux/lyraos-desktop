# KIWI's ISO builder writes 02-livecd.conf before generating the live initrd
# and removes it before packing the rootfs. Match that build context only:
# installed-system initrds must retain Plymouth and its Lyra label plugin.
case " ${add_dracutmodules:-} " in
    *" kiwi-live "*) omit_dracutmodules+=" plymouth lyra-plymouth " ;;
esac
